version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "Installing dependencies"
      - npm ci
  build:
    commands:
      - echo "Building application"
      - npm run build
  post_build:
    commands:
      - echo "Build completed on $(date)"
      - mkdir -p deploy
      - cp -r dist deploy/
      - cp server.js package.json appspec.yml deploy/
      - cp -r scripts deploy/

artifacts:
  base-directory: deploy
  files:
    - '**/*'
  discard-paths: no
