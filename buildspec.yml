version: 0.2 

phases: 
install:
runtime-versions:
nodejs: 18
commands:
- echo "Installing Dependencies"
- npm install
build : 
commands: 
- echo "Building application"
- npm run build 
post_build:
commands:
- echo "Build Completed on 'date'"
- mkdir -p deployment
- cp -r dist/* deploy/
- cp appspec.yml deploy/
- cp -r scripts/ deploy/scripts/
artifacts:
files:
- deploy/**/*
discard-paths : no